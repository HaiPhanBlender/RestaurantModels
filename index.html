<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f5f4f0">
<title>Trình xem mô hình 3D</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
:root{color-scheme:light;--ink:#20231f;--muted:#70766e;--line:#e6e7e1;--accent:#375c4b}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#f5f4f0;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}main{width:min(100%,760px);margin:auto;padding:24px 18px 36px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 18px}.brand{font-size:12px;font-weight:750;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}.badge{color:#657066;font-size:12px}h1{font-size:clamp(27px,7vw,42px);line-height:1.07;letter-spacing:-.045em;margin:0 0 9px}.intro{margin:0 0 20px;color:var(--muted);line-height:1.55;font-size:15px}.viewer-card{overflow:hidden;border:1px solid var(--line);border-radius:24px;background:#fff;box-shadow:0 12px 35px #20231f0a}model-viewer{display:block;width:100%;height:min(65vh,520px);min-height:340px;background:radial-gradient(ellipse at 50% 43%,#fff 0,#f4f5f0 75%);--poster-color:transparent;touch-action:none;overscroll-behavior:contain}.hint{padding:0 18px 16px;text-align:center;color:#737970;font-size:13px}.upload-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:16px;border-top:1px solid var(--line)}button,.file-label{appearance:none;border:0;border-radius:999px;padding:12px 17px;font-size:14px;font-weight:600;cursor:pointer}.primary{color:white;background:var(--accent)}.secondary{color:#39443c;background:#eff1ec}input[type=file]{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.notice{display:none;margin:12px 3px 0;padding:12px 14px;color:#5a4530;background:#fff4df;border-radius:12px;font-size:13px;line-height:1.5}footer{margin:16px 4px 0;color:#858a82;font-size:12px;line-height:1.5;text-align:center}@media(max-width:420px){main{padding:18px 13px 28px}model-viewer{min-height:310px;height:56vh}}
</style></head>
<body><main><header><div class="brand">3D Studio</div><div class="badge">Mở bằng trình duyệt · Không cần cài app</div></header><h1 id="title">Khám phá mô hình 3D</h1><p class="intro">Chạm và kéo để xoay mô hình. Dùng hai ngón tay để phóng to hoặc thu nhỏ.</p>
<section class="viewer-card" aria-label="Trình xem mô hình 3D"><model-viewer id="viewer" src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" alt="Mô hình phi hành gia 3D" camera-controls touch-action="none" auto-rotate rotation-per-second="22deg" shadow-intensity="1" exposure="1" environment-image="neutral" loading="eager"></model-viewer><div class="hint">Kéo để xoay · Chụm/mở hai ngón để thu phóng</div><div class="upload-row"><label class="file-label secondary" for="file">Chọn model của bạn</label><input id="file" type="file" accept=".glb,.gltf,model/gltf-binary,model/gltf+json"><button class="primary" id="reset" type="button">Đặt lại góc nhìn</button></div></section><div id="notice" class="notice" role="status"></div><footer>Trang mẫu · Để chia sẻ qua mã QR, cần tải trang và model lên một địa chỉ web công khai.</footer></main>
<script>const viewer=document.querySelector('#viewer'),fileInput=document.querySelector('#file'),notice=document.querySelector('#notice'),title=document.querySelector('#title');let localUrl;fileInput.addEventListener('change',()=>{const file=fileInput.files?.[0];if(!file)return;if(localUrl)URL.revokeObjectURL(localUrl);localUrl=URL.createObjectURL(file);viewer.src=localUrl;viewer.alt=`Mô hình 3D ${file.name}`;title.textContent=file.name.replace(/\.(glb|gltf)$/i,'').replace(/[-_]+/g,' ');notice.style.display='block';notice.textContent='Mô hình đang được xem trên thiết bị này. Để người khác xem khi quét QR, bạn cần tải file model lên cùng website và đặt đường dẫn model trong trang.'});document.querySelector('#reset').addEventListener('click',()=>{viewer.cameraOrbit='0deg 75deg 105%';viewer.fieldOfView='auto'});</script></body></html>
